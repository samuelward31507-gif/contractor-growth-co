<!-- =========================================================
     CGC WEBSITE PATCH — v1
     Apply to the EXISTING Contractor Growth Co. website.
     This patch is intentionally additive: it preserves the
     existing website structure and only overrides/updates
     targeted styling, copy, pricing, CTAs, and package messaging.

     INSERT THIS ENTIRE BLOCK immediately before </body>.
========================================================= -->

<style id="cgc-patch-v1">

/* ---------- CGC GREEN / GREY / WHITE VISUAL SYSTEM ---------- */

:root{
  --orange:#22c55e;
  --orange-light:#4ade80;
  --orange-dark:#16a34a;
  --orange-soft:rgba(34,197,94,.10);

  --green:#22c55e;

  --bg:#070908;
  --surface:#0c100d;
  --surface-2:#121713;
  --surface-3:#1a211c;

  --text:#f5f7f5;
  --muted:#a5ada7;
  --dim:#6f7771;

  --border:rgba(255,255,255,.085);
  --border-strong:rgba(255,255,255,.17);
}

/* Remove the old orange visual language everywhere by making
   existing orange-driven components inherit the new green vars. */

.hero-glow,
.final-glow{
  background:radial-gradient(
    ellipse,
    rgba(34,197,94,.13),
    transparent 68%
  ) !important;
}

.hero-badge{
  border-color:rgba(34,197,94,.28) !important;
  background:rgba(34,197,94,.07) !important;
}

.pulse-dot{
  background:var(--green) !important;
}

.btn-primary{
  color:#071009 !important;
  background:var(--green) !important;
  box-shadow:0 15px 40px rgba(34,197,94,.13) !important;
}

.btn-primary:hover{
  background:var(--orange-light) !important;
  box-shadow:0 20px 55px rgba(34,197,94,.20) !important;
}

.pricing-card.featured{
  background:linear-gradient(
    150deg,
    rgba(34,197,94,.09),
    #090b09 45%
  ) !important;
  border-color:rgba(34,197,94,.42) !important;
  box-shadow:0 25px 80px rgba(34,197,94,.06) !important;
}

.popular{
  background:var(--green) !important;
}

.system-card:hover::after{
  background:var(--green) !important;
}

.pain-card:hover,
.industry:hover{
  border-color:rgba(34,197,94,.32) !important;
}

.pain-icon{
  background:rgba(34,197,94,.08) !important;
  color:var(--green) !important;
}

.chart .fill{
  fill:rgba(34,197,94,.14) !important;
}

.chart .line{
  stroke:var(--green) !important;
}

.track-logo span,
.logo span,
h1 span,
h2 em,
.eyebrow,
.tier,
.system-icon,
.workflow-card span{
  color:var(--green) !important;
}

.fine-print::after{
  content:"";
}

/* ---------- PREMIUM UX POLISH ---------- */

.btn{
  border-radius:11px;
  letter-spacing:-.01em;
}

.pricing-card,
.dashboard,
.system-grid,
.workflow-grid{
  box-shadow:0 20px 70px rgba(0,0,0,.18);
}

.pricing-card:hover{
  box-shadow:0 28px 90px rgba(0,0,0,.28);
}

.system-card,
.workflow-card,
.metric-card,
.industry,
.pain-card{
  transition:
    transform 180ms ease,
    border-color 180ms ease,
    background 180ms ease,
    box-shadow 180ms ease;
}

/* ---------- TRUST / GUARANTEE STRIP ---------- */

.cgc-guarantee{
  margin:28px auto 0;
  max-width:760px;
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:9px 22px;
  color:var(--muted);
  font-size:.72rem;
  font-weight:800;
}

.cgc-guarantee span::before{
  content:"✓";
  margin-right:7px;
  color:var(--green);
}

/* ---------- PACKAGE OUTCOME LABELS ---------- */

.cgc-package-outcome{
  margin-top:8px;
  color:var(--green);
  font-size:.68rem;
  font-weight:900;
  letter-spacing:.11em;
  text-transform:uppercase;
}

/* ---------- SUBTLE "MANAGED SYSTEM" CALLOUT ---------- */

.cgc-managed-note{
  margin:22px auto 0;
  max-width:760px;
  padding:14px 18px;
  border:1px solid var(--border);
  border-radius:12px;
  background:rgba(255,255,255,.018);
  color:var(--muted);
  font-size:.74rem;
  line-height:1.65;
}

.cgc-managed-note strong{
  color:var(--text);
}

/* ---------- MOBILE ---------- */

@media(max-width:720px){
  .cgc-guarantee{
    gap:8px 14px;
    font-size:.68rem;
  }

  .cgc-managed-note{
    font-size:.70rem;
  }
}

</style>

<script id="cgc-patch-v1-script">
(() => {
  "use strict";

  /* ---------------------------------------------------------
     Small helpers
  --------------------------------------------------------- */

  const all = (selector) =>
    Array.from(document.querySelectorAll(selector));

  const findText = (text) =>
    all("body *").find(el =>
      el.children.length === 0 &&
      el.textContent.trim() === text
    );

  const setExact = (oldText, newText) => {
    const el = findText(oldText);
    if (el) el.textContent = newText;
  };

  const replaceText = (oldText, newText) => {
    all("body *").forEach(el => {
      if (el.children.length === 0 && el.textContent.includes(oldText)) {
        el.textContent = el.textContent.replace(oldText, newText);
      }
    });
  };

  const setHrefContaining = (needle, href) => {
    all(`a[href*="${needle}"]`).forEach(a => {
      a.href = href;
    });
  };

  /* ---------------------------------------------------------
     1. POSITIONING / COPY
  --------------------------------------------------------- */

  setExact(
    "Turn More Contractor Leads Into Booked Jobs.",
    "Turn More Contractor Leads Into More Booked Jobs."
  );

  setExact(
    "Everything your growth needs. Connected.",
    "Your Growth System. Connected."
  );

  setExact(
    "Choose the system built for your stage.",
    "Choose the Growth System Built for Your Stage."
  );

  setExact(
    "Your business. Your numbers. One dashboard.",
    "Know What Is Happening Across Your Business."
  );

  setExact(
    "Build the foundation.",
    "Capture Every Opportunity."
  );

  setExact(
    "Turn the system on.",
    "Convert More Leads."
  );

  setExact(
    "Build the advanced system.",
    "Automate the Customer Lifecycle."
  );

  /* More outcome-focused package descriptions. */
  const planDescriptions = all(".plan-description");

  if (planDescriptions[0]) {
    planDescriptions[0].textContent =
      "The essential growth infrastructure for contractors who want to capture every opportunity, respond faster, and stop losing leads.";
  }

  if (planDescriptions[1]) {
    planDescriptions[1].textContent =
      "The complete lead-conversion system for contractors ready to automate follow-up, qualification, appointments, and business visibility.";
  }

  if (planDescriptions[2]) {
    planDescriptions[2].textContent =
      "The advanced customer lifecycle system for established contractors ready to automate more of the journey from first contact through repeat business.";
  }

  /* ---------------------------------------------------------
     2. PRICING — REVISED RECOMMENDED CGC PRICING
  --------------------------------------------------------- */

  const pricing = all(".pricing-card");

  const pricingData = [
    {
      setup: "$1,497",
      monthly: "$397",
      outcome: "CAPTURE EVERY OPPORTUNITY"
    },
    {
      setup: "$1,997",
      monthly: "$697",
      outcome: "CONVERT MORE LEADS"
    },
    {
      setup: "$2,997",
      monthly: "$997",
      outcome: "AUTOMATE THE CUSTOMER LIFECYCLE"
    }
  ];

  pricing.forEach((card, i) => {
    const data = pricingData[i];
    if (!data) return;

    const setup = card.querySelector(".setup strong");
    const monthly = card.querySelector(".monthly");

    if (setup) setup.textContent = data.setup;

    if (monthly) {
      const small = monthly.querySelector("small");
      monthly.childNodes.forEach(node => {
        if (node.nodeType === Node.TEXT_NODE) {
          node.textContent = data.monthly + " ";
        }
      });
      if (!monthly.textContent.includes(data.monthly)) {
        monthly.insertBefore(
          document.createTextNode(data.monthly + " "),
          monthly.firstChild
        );
      }
      if (small) small.textContent = "/ month";
    }

    if (!card.querySelector(".cgc-package-outcome")) {
      const outcome = document.createElement("div");
      outcome.className = "cgc-package-outcome";
      outcome.textContent = data.outcome;

      const tier = card.querySelector(".tier");
      if (tier) tier.insertAdjacentElement("afterend", outcome);
    }
  });

  /* ---------------------------------------------------------
     3. FOUNDATION FEATURES
  --------------------------------------------------------- */

  const foundation = pricing[0];
  if (foundation) {
    const features = foundation.querySelector(".features");

    if (features) {
      features.innerHTML = `
        <li><span class="check">✓</span>Conversion-focused website</li>
        <li><span class="check">✓</span>Lead capture system</li>
        <li><span class="check">✓</span>Basic speed-to-lead follow-up</li>
        <li><span class="check">✓</span>Missed-opportunity follow-up</li>
        <li><span class="check">✓</span>Lead notifications</li>
        <li><span class="check">✓</span>Basic TrackPR reporting</li>
        <li><span class="check">✓</span>Website maintenance</li>
        <li><span class="check">✓</span>Ongoing management & support</li>
      `;
    }
  }

  /* ---------------------------------------------------------
     4. GROWTH FEATURES — FLAGSHIP PACKAGE
  --------------------------------------------------------- */

  const growth = pricing[1];
  if (growth) {
    const features = growth.querySelector(".features");

    if (features) {
      features.innerHTML = `
        <li><span class="check">✓</span>Everything in Foundation</li>
        <li><span class="check">✓</span>Advanced speed-to-lead follow-up</li>
        <li><span class="check">✓</span>AI-assisted lead qualification</li>
        <li><span class="check">✓</span>Conversation intelligence</li>
        <li><span class="check">✓</span>Appointment confirmations & reminders</li>
        <li><span class="check">✓</span>Accepted estimate → job workflow</li>
        <li><span class="check">✓</span>Lead reactivation</li>
        <li><span class="check">✓</span>Human hot-lead alerts</li>
        <li><span class="check">✓</span>Daily contractor briefing</li>
        <li><span class="check">✓</span>AI business insights</li>
        <li><span class="check">✓</span>Enhanced TrackPR analytics</li>
        <li><span class="check">✓</span>Ongoing optimization</li>
      `;
    }
  }

  /* ---------------------------------------------------------
     5. DOMINATE FEATURES
  --------------------------------------------------------- */

  const dominate = pricing[2];
  if (dominate) {
    const features = dominate.querySelector(".features");

    if (features) {
      features.innerHTML = `
        <li><span class="check">✓</span>Everything in Growth</li>
        <li><span class="check">✓</span>AI voice receptionist</li>
        <li><span class="check">✓</span>Advanced AI customer communication</li>
        <li><span class="check">✓</span>Automated estimate follow-up</li>
        <li><span class="check">✓</span>Post-job customer growth engine</li>
        <li><span class="check">✓</span>Review & referral automation</li>
        <li><span class="check">✓</span>Past-customer win-back campaigns</li>
        <li><span class="check">✓</span>Payment & revenue synchronization</li>
        <li><span class="check">✓</span>Multi-source attribution</li>
        <li><span class="check">✓</span>Advanced TrackPR revenue intelligence</li>
        <li><span class="check">✓</span>Custom integrations & AI workflows</li>
      `;
    }
  }

  /* ---------------------------------------------------------
     6. PRICING NOTE
  --------------------------------------------------------- */

  const pricingNote = document.querySelector(".pricing-note");

  if (pricingNote) {
    pricingNote.textContent =
      "No long-term contract required. Usage-based SMS, voice, or third-party costs may apply where applicable.";
  }

  /* ---------------------------------------------------------
     7. ADD TRUST / GUARANTEE / MANAGEMENT MESSAGE
  --------------------------------------------------------- */

  const pricingHeading = document.querySelector("#packages .section-heading");

  if (pricingHeading && !document.querySelector(".cgc-managed-note")) {
    const note = document.createElement("div");
    note.className = "cgc-managed-note";
    note.innerHTML =
      "<strong>This is a managed growth system — not another piece of software.</strong> We build it, manage it, maintain it, and keep improving it so your team can stay focused on running the business.";
    pricingHeading.appendChild(note);
  }

  const finalContent = document.querySelector(".final-content");

  if (finalContent && !document.querySelector(".cgc-guarantee")) {
    const guarantee = document.createElement("div");
    guarantee.className = "cgc-guarantee";
    guarantee.innerHTML = `
      <span>30-Day Satisfaction Guarantee</span>
      <span>No Long-Term Contract Required</span>
      <span>Managed For You</span>
    `;

    const finePrint = finalContent.querySelector(".fine-print");
    if (finePrint) {
      finePrint.insertAdjacentElement("beforebegin", guarantee);
    } else {
      finalContent.appendChild(guarantee);
    }
  }

  /* ---------------------------------------------------------
     8. HERO COPY — STRONGER OUTCOME POSITIONING
  --------------------------------------------------------- */

  const heroCopy = document.querySelector(".hero-copy");

  if (heroCopy) {
    heroCopy.textContent =
      "We build and manage the website, lead capture, follow-up automation, AI, and business intelligence systems that help contractors capture more opportunities, respond faster, and turn more leads into booked work.";
  }

  /* ---------------------------------------------------------
     9. SYSTEM CARDS — OUTCOME LANGUAGE
  --------------------------------------------------------- */

  const systemCards = all(".system-card");

  const systemUpdates = [
    [
      "Conversion Website",
      "A modern contractor website built to turn visitors into calls, forms, and real opportunities."
    ],
    [
      "Lead Capture",
      "Capture inquiries from your website and connected lead sources so opportunities don't disappear."
    ],
    [
      "Automated Follow-Up",
      "Keep leads moving with timely follow-up that continues even when your team is busy."
    ],
    [
      "AI Assistance",
      "AI helps qualify opportunities, understand conversations, surface important leads, and reduce repetitive work."
    ],
    [
      "Business Analytics",
      "See leads, appointments, estimates, jobs, revenue, close rates, and lead sources in one place."
    ],
    [
      "Ongoing Management",
      "We maintain and optimize the system so you don't have to become the person responsible for your automation."
    ]
  ];

  systemCards.forEach((card, i) => {
    const update = systemUpdates[i];
    if (!update) return;

    const h3 = card.querySelector("h3");
    const p = card.querySelector("p");

    if (h3) h3.textContent = update[0];
    if (p) p.textContent = update[1];
  });

  /* ---------------------------------------------------------
     10. AI SECTION — POSITION AS BACK-END ENGINE
  --------------------------------------------------------- */

  const workflowCards = all(".workflow-card");

  const workflowUpdates = [
    ["01 — CAPTURE", "The opportunity enters.", "A new inquiry comes through your website, a connected source, a call, or another supported channel."],
    ["02 — UNDERSTAND", "AI understands it.", "AI helps identify the service, urgency, customer intent, and important details."],
    ["03 — PRIORITIZE", "The important leads stand out.", "Higher-value or urgent opportunities can be surfaced for faster human attention."],
    ["04 — RESPOND", "The system keeps things moving.", "Automated communication and notifications help reduce delays and missed opportunities."],
    ["05 — FOLLOW UP", "Follow-up continues.", "The system can continue the appropriate follow-up instead of relying on someone to remember every lead."],
    ["06 — TRACK", "The business learns from it.", "Activity and results flow into your reporting and business intelligence."]
  ];

  workflowCards.forEach((card, i) => {
    const update = workflowUpdates[i];
    if (!update) return;

    const span = card.querySelector("span");
    const h3 = card.querySelector("h3");
    const p = card.querySelector("p");

    if (span) span.textContent = update[0];
    if (h3) h3.textContent = update[1];
    if (p) p.textContent = update[2];
  });

  /* ---------------------------------------------------------
     11. FAQ — CLARIFY MANAGED SERVICE MODEL
  --------------------------------------------------------- */

  const faqItems = all(".faq-item");

  faqItems.forEach(item => {
    const question = item.querySelector(".faq-question strong");
    const answer = item.querySelector(".faq-answer > div");
    if (!question || !answer) return;

    const q = question.textContent.trim();

    if (q === "Do I need to know anything about AI?") {
      answer.textContent =
        "No. You don't need to learn AI or become an automation expert. We build and manage the technology behind the system so your team can use the finished experience.";
    }

    if (q === "Will I have to manage the automations?") {
      answer.textContent =
        "No. Your system is managed for you. We build, monitor, maintain, and optimize the automations included with your package.";
    }

    if (q === "Do I need to use a complicated CRM?") {
      answer.textContent =
        "No. TrackPR is designed to give you a clear view of the business without forcing your team to learn a massive CRM just to understand what is happening.";
    }

    if (q === "Can I upgrade later?") {
      answer.textContent =
        "Absolutely. Start with the level that fits your business today and move into more advanced automation, AI, integrations, and intelligence as your needs grow.";
    }
  });

  /* ---------------------------------------------------------
     12. REMOVE OLD LANDING-PAGE ROUTING
         The current marketing site should send visitors to
         the package section rather than the old landing page.
  --------------------------------------------------------- */

  setHrefContaining(
    "contractorgrowthco.pro/landing-page",
    "#packages"
  );

  /* ---------------------------------------------------------
     13. ACCESSIBILITY / POLISH
  --------------------------------------------------------- */

  all(".pricing-card .btn").forEach(btn => {
    btn.setAttribute("aria-label", btn.textContent.trim());
  });

  all("a.btn").forEach(btn => {
    btn.style.textDecoration = "none";
  });

})();
</script>

<!-- =========================================================
     END CGC WEBSITE PATCH
========================================================= -->
